     <h2 style ="text-align:center;">Github and File Manipulation</h2>



    <p>Repositories are project folders that are stored in Github.</p>
    <br>
    <p>Forks are your own copy of someone else's repository on Github.</p>
    <br>
    <p>Branches are a separate version of a project. Usually the default branch is called main</p>
    <br>
    <p>Branch -m 'name of branch': Creates a new branch.</p>
